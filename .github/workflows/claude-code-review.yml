name: Claude Code Review

# Do not switch this to `pull_request_target`.
# Anthropic's token-exchange endpoint rejects OIDC tokens minted for that
# event, so the job fails with "401 Unauthorized - Invalid OIDC token"
# before Claude ever runs. See
# https://github.com/anthropics/claude-code-action/issues/713
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # pull-requests: write is safe here because this workflow uses the
    # `pull_request` trigger (not `pull_request_target`): GitHub always
    # forces a read-only GITHUB_TOKEN for PRs from forks regardless of what
    # this block declares, so forked PRs stay read-only either way. Without
    # write access here, same-repo PRs (the common case in this repo) never
    # get their review posted even though the job itself succeeds.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

