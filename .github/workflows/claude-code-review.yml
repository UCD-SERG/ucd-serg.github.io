# Caller stub for Morrison-Lab/gha's reusable claude-code-review.yml.
#
# Replaces this repo's two hand-rolled review workflows (the former
# claude-code-review.yml, which called anthropics/claude-code-action directly,
# and claude-review-comment.yml, deleted alongside this change). See #101.
#
# NOTE: Do NOT declare a top-level `concurrency:` block here. The reusable
# workflow manages per-PR concurrency internally on its own job
# (`group: claude-review-<PR>`); a caller-level group with the same name as
# that nested group deadlocks GitHub Actions and cancels the run (gha#437).
# gha#437 tested the identical-name case specifically; a differently-named
# PR-scoped group is untested, so the safe rule is to declare none.
#
# Secrets are passed explicitly rather than with `secrets: inherit`: GitHub
# only inherits secrets into a reusable workflow owned by the same
# organization or enterprise, and this is a UCD-SERG repo calling a
# Morrison-Lab workflow, so `inherit` would hand it an empty token.
name: Claude Code Review

on:
  # Automatic review on PR activity. Same `types:` list the hand-rolled
  # workflow used, and deliberately still `pull_request` rather than
  # `pull_request_target`: Anthropic's token-exchange endpoint rejects OIDC
  # tokens minted for pull_request_target, so the job 401s before Claude runs
  # (anthropics/claude-code-action#713, this repo's #83/#89/#90).
  #
  # The trigger list is unchanged; the BEHAVIOUR is not. The hand-rolled
  # workflow had no job-level `if:` at all, so it attempted a review on every
  # matching event. The reusable workflow adds three skip gates, and each one
  # silently stops reviewing a case this repo used to attempt:
  #   * draft PRs                     (`pull_request.draft == false`)
  #   * fork PRs                      (`head.repo.full_name == github.repository`)
  #   * bot-sender events             (`sender.type != 'Bot'`)
  # The third one changes #84 (Copilot-authored PRs 401 on token exchange)
  # from a red failure into a gray skip. That is an improvement in signal, not
  # a fix -- #84 stays open.
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # On-demand `/review` from a trusted collaborator, replacing
  # claude-review-comment.yml's `@claude review` path for SAME-REPO PRs only
  # (see the fork notice in the dispatch step below).
  #
  # The command must be the FIRST characters of the comment, followed by
  # whitespace or end-of-comment: `/review` or `/review please`. A leading
  # space or newline, or `Looks good, /review`, matches nothing, so every job
  # skips and the run is recorded as skipped with nothing posted. (A run is
  # still created -- this repo's history holds 23 such skipped runs for the
  # workflow being deleted here.) This is narrower than the deleted workflow,
  # which matched
  # `@claude review` anywhere in the body.
  #
  # It is a slash command rather than a mention on purpose: any `@claude`
  # substring also wakes claude.yml's agent on the same comment, so a mention
  # would spend a second paid agent run alongside this one.
  issue_comment:
    types: [created]
  # Needed for two things. Today: so the `/review` job below can re-enter this
  # workflow. Once #100 lands: so gha's claude.yml can re-dispatch a review of
  # the commits an @claude run pushes. This repo's current bespoke claude.yml
  # cannot dispatch anything (it holds `actions: read`, not `actions: write`,
  # and has no dispatch step), so that second use is inert until #100 merges.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string

jobs:
  # `/review` at the start of a PR comment (from an OWNER/MEMBER/COLLABORATOR)
  # dispatches an on-demand review of that PR, independent of claude.yml.
  # Re-enters the workflow_dispatch path below, so this file must be on the
  # default branch before the dispatch resolves.
  dispatch-on-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/review') ||
      (vars.CLAUDE_AGENT_DISABLED == 'true' &&
      contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    # `pull-requests: read` is declared so the `gh api repos/../pulls/N` call
    # below does not depend on this repo happening to be public. Declaring any
    # scope in this block sets every unlisted scope to no-access, so it is not
    # covered by the default token; on a public repo the read would generally
    # succeed anyway, which is exactly why the omission would go unnoticed
    # until the repo went private.
    permissions:
      actions: write         # dispatch this workflow
      issues: write          # acknowledge the /review comment
      pull-requests: read    # read the PR's head branch and head repo
    steps:
      - name: Parse this workflow's ref
        id: this-wf
        uses: Morrison-Lab/gha/.github/actions/parse-workflow-ref@v2
        with:
          workflow-ref: ${{ github.workflow_ref }}

      # Only active when the repository variable CLAUDE_AGENT_DISABLED is
      # 'true'. It is unset here, so this step never runs.
      #
      # With it unset, `@claude review` reaches claude.yml's agent and NOT
      # this workflow, so it does not produce a plugin review. Until #100
      # lands, `/review` is the only comment phrasing that produces a review.
      - name: Check for an `@claude review` request
        id: mention
        if: ${{ vars.CLAUDE_AGENT_DISABLED == 'true' }}
        uses: Morrison-Lab/gha/.github/actions/detect-review-request@v2
        with:
          comment-body: ${{ github.event.comment.body }}

      - name: Dispatch a review for the commented PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          WF_PATH: ${{ steps.this-wf.outputs.path }}
          # Passed via env (not inlined) so the comment body is a shell value,
          # never interpreted as script -- avoids injection.
          COMMENT_BODY: ${{ github.event.comment.body }}
          # Empty when the step above was skipped, i.e. when the fallback is off.
          MENTION_MATCH: ${{ steps.mention.outputs.match }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The job-level `if:` only does cheap pre-filters; GitHub Actions
          # expressions can't reliably tell '/review' from '/reviewer' or
          # handle a newline/tab after the command. Enforce the real match
          # here. Note a '/reviewers ...' comment DOES start a run, which then
          # exits 0 here with only a log line.
          if [[ "$COMMENT_BODY" =~ ^/review([[:space:]]|$) ]]; then
            TRIGGER='/review'
          elif [ "$MENTION_MATCH" = 'true' ]; then
            TRIGGER='@claude review'
          else
            echo "Comment is neither a standalone '/review' command nor an '@claude review' request; skipping dispatch."
            exit 0
          fi
          WF_FILE=$(basename "$WF_PATH")
          # This job never checks out the repo, so the PR's head branch has to
          # be looked up explicitly.
          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          PR_BRANCH=$(jq -r '.head.ref' <<< "$PR_JSON")
          PR_HEAD_REPO=$(jq -r '.head.repo.full_name' <<< "$PR_JSON")

          # Stop here for a fork PR, and say so, rather than dispatching a run
          # that cannot review it. The reusable workflow's dispatch guard
          # (gha#235) declines fork PRs, and its claude-review job then skips
          # -- so dispatching would post ":mag: dispatched a review" and
          # deliver nothing, with no red check to contradict the promise.
          #
          # Note the guard's reason is NOT the OIDC restriction that stops
          # fork reviews on the `pull_request` path. A dispatched run executes
          # in base-repo context with base-repo secrets, so no fork token is
          # involved; upstream describes the guard as failing a mistaken
          # dispatch fast rather than closing a hole. #90 tracks the real
          # fork-review gap.
          #
          # The deleted claude-review-comment.yml aimed at this case with a
          # refs/pull/<n>/head checkout. Of its 25 recorded runs, 23 skipped
          # at the job `if:` and exactly one executed to completion -- run
          # 30687108541, on 2026-08-01, against this very fork PR (#77). It
          # posted nothing, because its prompt never carried `--comment`
          # (#96); #97 fixed that for the other review workflow and never for
          # this one. So the path was exercised once and was non-functional,
          # rather than never exercised.
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::warning::PR #$PR_NUMBER is from a fork ($PR_HEAD_REPO); the reusable review workflow declines fork reviews, so no review was dispatched."
            gh issue comment "$PR_NUMBER" --repo "$REPO" \
              --body ":no_entry: \`$TRIGGER\` received, but this PR is from a fork (\`$PR_HEAD_REPO\`), and the reusable review workflow's dispatch guard declines fork PRs. Tracked in #90." \
              || echo "::warning::Could not post the fork notice."
            exit 0
          fi

          # A `workflow_dispatch` runs the workflow file AS IT EXISTS AT THE
          # DISPATCHED REF, so `--ref "$PR_BRANCH"` needs that branch to exist
          # AND its copy of this file to already carry the workflow_dispatch
          # trigger. Neither is guaranteed: this PR is what ADDS the trigger,
          # so every branch cut before it lacks it, and a closed PR's head
          # branch may have been deleted outright.
          #
          # So try the PR branch first (it pins the review's check-runs to the
          # right commit), fall back to a no-ref dispatch against the default
          # branch (upstream's documented lesser problem -- the check-run
          # mis-attributes), and only acknowledge if one of them actually
          # started a run. Acknowledging unconditionally is what turns a
          # failed dispatch into a promise nothing keeps.
          echo "Dispatching $WF_FILE to review PR #$PR_NUMBER ($PR_BRANCH) ($TRIGGER comment)."
          DISPATCHED=false
          if gh workflow run "$WF_FILE" --repo "$REPO" --ref "$PR_BRANCH" -f pr_number="$PR_NUMBER"; then
            DISPATCHED=true
          elif gh workflow run "$WF_FILE" --repo "$REPO" -f pr_number="$PR_NUMBER"; then
            DISPATCHED=true
            echo "::notice::Dispatch against '$PR_BRANCH' failed; dispatched against the default branch instead. The review check-run will attribute to the default branch."
          fi

          if [ "$DISPATCHED" = 'true' ]; then
            gh issue comment "$PR_NUMBER" --repo "$REPO" \
              --body ":mag: \`$TRIGGER\` received -- dispatched a Claude review of this PR (see the [dispatch run]($RUN_URL)). The review posts as its own comment when it finishes." \
              || echo "::warning::Could not acknowledge the $TRIGGER comment."
          else
            echo "::error::Could not dispatch $WF_FILE for PR #$PR_NUMBER against either '$PR_BRANCH' or the default branch."
            gh issue comment "$PR_NUMBER" --repo "$REPO" \
              --body ":warning: \`$TRIGGER\` received, but the review could not be dispatched. \`$WF_FILE\` needs a \`workflow_dispatch\` trigger on both this PR's branch and the default branch, and at least one of them does not have it yet (see the [dispatch run]($RUN_URL))." \
              || echo "::warning::Could not report the failed dispatch."
            exit 1
          fi

  review:
    # pull_request and workflow_dispatch only; the issue_comment path is
    # handled by dispatch-on-comment above (which re-enters via
    # workflow_dispatch).
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      # Kept at `write` deliberately. Without it, same-repo PRs -- the common
      # case here -- get a job that succeeds and posts nothing (#91). Do not
      # narrow this to `read`.
      #
      # Two triggers reach this job, and they are safe for different reasons.
      # Under `pull_request` (not `pull_request_target`), GitHub forces a
      # read-only GITHUB_TOKEN for fork PRs regardless of what this block
      # declares. Under `workflow_dispatch` the token is NOT forced read-only
      # and the PR number is caller-supplied, so what bounds that path is
      # upstream's fork/Dependabot dispatch guard (gha#235) plus the
      # OWNER/MEMBER/COLLABORATOR gate on the job that dispatches.
      pull-requests: write
      issues: write
      id-token: write
      actions: read   # lets the reviewer read CI status (github_ci MCP server)
    uses: Morrison-Lab/gha/.github/workflows/claude-code-review.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # unset here; empty when using OAuth
    with:
      # Wires the workflow_dispatch input through so a dispatched review knows
      # which PR to read; empty (and ignored) on pull_request runs.
      pr-number: ${{ inputs.pr_number }}
      # INPUT DEFAULTS accepted deliberately. Named here rather than set, so
      # this `with:` block carries only deviations -- but named rather than
      # left silent, because each is new behaviour relative to the
      # hand-rolled workflow:
      #   report-cost: true     appends the run's dollar cost to whichever
      #                         comment the workflow already posts (its own
      #                         comment only on the commit-and-dispatch path);
      #                         the old workflow reported no cost at all
      #   use-ai-config: true   installs the Morrison-Lab/ai-config plugin into the reviewer
      #   lab-manual: true      R/tidyverse SERG lab manual; this is an R + Quarto repo
      #   track-progress: false agent mode, so summary-only reviews and no git write tools
      #
      # A JOB, not an input: the reusable workflow adds `require-review`. It
      # is not in this repo's branch ruleset (which requires build-deploy,
      # lint-project and Spellcheck), so it cannot block a merge. Note it can
      # report red when a review run is CANCELLED rather than failed, which
      # happens when a push and a dispatched review race.
      #
      # A COMMENTED-OUT INPUT, below: set `show-full-output: true` if a review
      # again completes without posting (#105). It un-hides
      # claude-code-action's SDK output, which otherwise prints "full output
      # hidden for security" and makes an auth/usage rejection or a denied
      # tool call unreadable from the check alone. Upstream defaults it to
      # false, so leaving it unset changes nothing today.
      # show-full-output: true
